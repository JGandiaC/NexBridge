apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexbridge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexbridge
        app.kubernetes.io/component: tunnel
    spec:
      serviceAccountName: nexbridge
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: tunnel
          image: nexbridge:latest   # reescrito por kustomization (images:)
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nexbridge-config
          ports:
            - name: openai
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: ssh-secret
              mountPath: /run/secrets/tunnel
              readOnly: true
            - name: runtime
              mountPath: /run/tunnel
          startupProbe:
            exec: { command: ["/usr/local/bin/healthcheck.sh"] }
            periodSeconds: 5
            failureThreshold: 24          # hasta 2 min para el primer túnel
          readinessProbe:
            exec: { command: ["/usr/local/bin/healthcheck.sh", "--deep"] }
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 2
          livenessProbe:
            exec: { command: ["/usr/local/bin/healthcheck.sh"] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4           # 2 min sin listener → reinicio
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # entrypoint (root) copia secrets → usuario tunnel y baja privilegios
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
      volumes:
        - name: ssh-secret
          secret:
            secretName: nexbridge-ssh
            defaultMode: 0400
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
