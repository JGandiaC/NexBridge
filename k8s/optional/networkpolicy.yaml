# Opcional: limita quién consume el túnel y hacia dónde sale el pod.
# Ajusta el CIDR del OnPrem y el selector de namespaces consumidores.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tunnel-connect
  namespace: tunnel-connect
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tunnel-connect
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tunnel-connect/consumer: "true"   # p. ej. el namespace de NexIA
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: x.x.x.x/32                    # servidor OnPrem
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
