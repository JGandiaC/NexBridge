# Opcional (producción): secretos en Azure Key Vault vía Secrets Store CSI Driver.
#   az aks enable-addons --addons azure-keyvault-secrets-provider -g <rg> -n <aks>
# Sustituye en deployment.yaml el volumen `ssh-secret` por:
#   - name: ssh-secret
#     csi:
#       driver: secrets-store.csi.k8s.io
#       readOnly: true
#       volumeAttributes:
#         secretProviderClass: tunnel-connect-kv
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tunnel-connect-kv
  namespace: tunnel-connect
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<workload-identity-client-id>"   # Workload Identity
    keyvaultName: "<nombre-keyvault>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: tunnel-connect-ssh-key
          objectType: secret
          objectAlias: id_rsa_ed25519
        - |
          objectName: tunnel-connect-ssh-passphrase
          objectType: secret
          objectAlias: passphrase
        - |
          objectName: tunnel-connect-ssh-known-hosts
          objectType: secret
          objectAlias: known_hosts
