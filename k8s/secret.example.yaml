# EJEMPLO — no aplicar con valores reales desde git.
# Recomendado:  make k8s-secret   (crea el Secret desde ./secrets/ sin YAML)
# Producción:   Azure Key Vault + Secrets Store CSI → k8s/optional/keyvault-secretproviderclass.yaml
apiVersion: v1
kind: Secret
metadata:
  name: tunnel-connect-ssh
  namespace: tunnel-connect
type: Opaque
stringData:
  id_rsa_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <llave privada cifrada con passphrase>
    -----END OPENSSH PRIVATE KEY-----
  passphrase: "<passphrase>"
  known_hosts: |
    [x.x.x.x]:443 ssh-ed25519 AAAA...
