apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tunnel-connect

# El Secret `tunnel-connect-ssh` NO se gestiona aquí:
#   make k8s-secret   (o Azure Key Vault, ver optional/)
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

images:
  - name: tunnel-connect
    newName: <tu-acr>.azurecr.io/tunnel-connect
    newTag: "0.2.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: tunnel-connect
      app.kubernetes.io/managed-by: kustomize
