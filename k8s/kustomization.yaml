apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexbridge

# El Secret `nexbridge-ssh` NO se gestiona aquí:
#   make k8s-secret   (o Azure Key Vault, ver optional/)
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

images:
  - name: nexbridge
    newName: <tu-acr>.azurecr.io/nexbridge
    newTag: "1.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: nexbridge
      app.kubernetes.io/managed-by: kustomize
